{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="display-6 text-primary mb-2"><i class="bi bi-box-arrow-in-right"></i></div>
                    <h3 class="fw-bold">Sign In to SecureShop</h3>
                    <p class="text-muted small">Access your order history, profile, and purchases</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="e.g. alice or admin" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>

                <hr class="my-4">

                <div class="bg-light p-3 rounded small border">
                    <span class="fw-bold text-dark d-block mb-1"><i class="bi bi-info-circle me-1"></i> Quick Test Accounts:</span>
                    <div>Customer: <code>alice</code> / <code>AlicePass456!</code></div>
                    <div>Administrator: <code>admin</code> / <code>AdminPass123!</code></div>
                </div>

                <div class="text-center mt-3">
                    <span class="text-muted small">Don't have an account? </span>
                    <a href="{{ url_for('auth.register') }}" class="small fw-semibold text-decoration-none">Create one here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
