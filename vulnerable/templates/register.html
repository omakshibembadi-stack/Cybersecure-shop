{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="display-6 text-primary mb-2"><i class="bi bi-person-plus"></i></div>
                    <h3 class="fw-bold">Create an Account</h3>
                    <p class="text-muted small">Register as a customer on SecureShop</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@domain.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="bio" class="form-label fw-semibold">Short Bio / Notes</label>
                        <textarea class="form-control" id="bio" name="bio" rows="2" placeholder="Tell us about yourself or your security focus..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-check-circle me-1"></i> Register Account
                    </button>
                </form>

                <div class="text-center mt-4">
                    <span class="text-muted small">Already have an account? </span>
                    <a href="{{ url_for('auth.login') }}" class="small fw-semibold text-decoration-none">Sign in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
